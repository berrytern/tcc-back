[package]
name = "tcc-back"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
time = "0.3.36"
futures = "0.3"
serde = "1.0.192"
serde_json = "1.0.108"
actix-web = "4"
jsonwebtoken = "9"
pwhash = "1"
dotenvy = "0.15.7"
utoipa = { version="5.4.0", features=["actix_extras"] }
utoipa-actix-web = "0.1"
async-trait = "0.1.74"
mongodb="3"
redis={ version="0.32", features=["aio", "tokio-comp", "json"]}
regex = "1.11.2"
once_cell = "1.18.0"
amqp-client-rust = "0.0.3-alpha.2"
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
fancy-regex = "0.16.1"
futures-util = "0.3.31"
